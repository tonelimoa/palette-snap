  <!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ドット絵コンバーター</title>
<style>
  :root{
    --bg: #100e22;
    --panel: #1c1a3a;
    --panel-2: #241f4a;
    --line: #372f68;
    --ink: #f6e5d8;
    --ink-dim: #b6acd6;
    --accent: #f26205;
    --accent-2: #f7a708;
    --ok: #6ee6a0;
    --danger: #e5504d;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "SF Mono","Consolas","Menlo",monospace;
    overscroll-behavior: none;
  }
  body{
    height: 100dvh;
    display:flex; flex-direction:column;
    overflow:hidden;
    background-image:
      radial-gradient(circle at 10% 0%, rgba(242,98,5,0.10), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(26,38,91,0.35), transparent 45%);
  }

  button, select{ font-family:inherit; }

  /* ---------------- top bar: undo/redo (left) + settings/save (right) ---------------- */
  .topbar{
    flex-shrink:0; height: 50px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding: 0 10px; padding-top: env(safe-area-inset-top, 0px);
    background: var(--panel); border-bottom:1px solid var(--line);
    position:relative; z-index: 30;
  }
  .grp{ display:flex; gap:7px; }
  .ibtn{
    width:36px; height:36px; border:1px solid var(--line); background:var(--panel-2);
    color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:16px;
    cursor:pointer; border-radius:5px; flex-shrink:0;
  }
  .ibtn:disabled{ opacity:0.3; cursor:not-allowed; }
  .ibtn.accent{ color:var(--accent-2); border-color:var(--accent-2); }
  .ibtn.on{ color:#1a0e05; background: var(--accent-2); border-color: var(--accent-2); }

  /* ---------------- main canvas area (fills remaining space, no scroll) ---------------- */
  .canvasarea{
    flex:1; min-height:0; position:relative; overflow:hidden;
    touch-action: none;
    background:
      linear-gradient(45deg, #2a2650 25%, transparent 25%) 0 0/16px 16px,
      linear-gradient(-45deg, #2a2650 25%, transparent 25%) 0 0/16px 16px,
      linear-gradient(45deg, transparent 75%, #2a2650 75%) 0 0/16px 16px,
      linear-gradient(-45deg, transparent 75%, #2a2650 75%) 0 0/16px 16px,
      #1a1738;
  }
  #outTransformWrap{
    position: absolute; top:0; left:0; transform-origin: 0 0; cursor: crosshair;
  }
  #outTransformWrap canvas{ display:block; image-rendering: pixelated; }
  /* all three layers are positioned absolutely at the same spot; with no
     z-index set, DOM order alone decides the stack: pixel art (bottom) ->
     reference, semi-transparent (middle) -> grid lines (top). The reference
     sits ON TOP of the pixel art (not behind it) because the converted
     artwork is fully opaque with no gaps -- a background layer would never
     be visible through it. */
  #outTransformWrap canvas.reflayer{ position:absolute; top:0; left:0; pointer-events:none; image-rendering:auto; }
  #outTransformWrap canvas.pixellayer{ position:absolute; top:0; left:0; }
  #outTransformWrap canvas.overlay{ position:absolute; top:0; left:0; pointer-events:none; }

  .drop{
    position:absolute; inset: 0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding: 24px;
  }
  .dropframe{
    width:100%; max-width: 300px; padding: 30px 18px;
    border: 2px dashed var(--accent-2); border-radius: 14px;
    background: rgba(36,31,74,0.35);
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .dropframe .big{ font-size: 34px; }
  .dropframe p{ margin:0; font-size:13px; color: var(--ink-dim); text-align:center; max-width:26ch; line-height:1.7; }
  .drop.drag .dropframe{ border-color: var(--accent); background: rgba(242,98,5,0.12); }

  /* ---------------- slide-up sheets (settings / download fallback) ---------------- */
  .backdrop{
    position:absolute; inset:0; background: rgba(5,4,10,0.45); z-index:15;
  }
  .sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:20;
    background: var(--panel); border-top:1px solid var(--line);
    padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px));
    max-height: 78%; overflow-y: auto;
    box-shadow: 0 -10px 26px rgba(0,0,0,0.4);
  }
  .sheet h3{
    margin:0 0 10px; font-size:11px; letter-spacing:0.04em; color: var(--ink-dim);
    font-weight:700; text-transform:uppercase; display:flex; align-items:center; gap:8px;
  }
  .sheet h3::before{ content:""; width:6px; height:6px; background: var(--accent); display:inline-block; }
  .sheet-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .sheet-row .lbl{ font-size:11px; color: var(--ink-dim); min-width:56px; }
  .gsbtn{
    height:32px; padding:0 12px; border:1px solid var(--line); background: var(--panel-2);
    color: var(--ink); font-size:12px; cursor:pointer; border-radius:5px; display:flex; align-items:center; gap:6px;
  }
  .gsbtn:hover{ border-color: var(--accent); color: var(--accent-2); }
  .gsbtn:disabled{ opacity:0.35; cursor:not-allowed; }
  .gsbtn.on{ color:#1a0e05; background: var(--accent-2); border-color: var(--accent-2); }
  select#sizeSelect{
    height:32px; padding:0 10px; border:1px solid var(--line); background: var(--panel-2);
    color: var(--accent-2); font-weight:700; font-size:13px; border-radius:5px; cursor:pointer;
  }
  select#sizeSelect:disabled{ opacity:0.35; cursor:not-allowed; color: var(--ink); }
  .filename{ font-size:10px; color: var(--ink-dim); word-break: break-all; }

  .candidate-grid{ display:flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
  .candidate{ width: 38px; cursor:pointer; text-align:center; user-select:none; }
  .candidate .cbox{ width: 38px; height: 30px; border: 2px solid var(--line); position:relative; opacity: 0.35; border-radius:3px; }
  .candidate.added .cbox{ border-color: var(--ok); opacity: 1; }
  .candidate .check{
    position:absolute; top:2px; right:2px; font-size:9px; color:#0a0a0a;
    background: var(--ok); width:13px; height:13px; display:none; align-items:center; justify-content:center; line-height:1; border-radius:2px;
  }
  .candidate.added .check{ display:flex; }

  .status-line{ font-size: 11px; color: var(--ink-dim); line-height:1.6; margin-top: 2px; }
  .hint-line{ font-size: 10px; color: var(--ink-dim); line-height:1.6; margin: 2px 0 12px; opacity:0.8; }

  #downloadPreviewImg{
    image-rendering: pixelated;
    width: 160px; height: 160px;
    border: 1px solid var(--line);
    background:
      linear-gradient(45deg, #2a2650 25%, transparent 25%) 0 0/16px 16px,
      linear-gradient(-45deg, #2a2650 25%, transparent 25%) 0 0/16px 16px,
      linear-gradient(45deg, transparent 75%, #2a2650 75%) 0 0/16px 16px,
      linear-gradient(-45deg, transparent 75%, #2a2650 75%) 0 0/16px 16px,
      #1a1738;
    display: block; margin-top:6px;
  }
  .close-sheet{
    position:absolute; top:8px; right:10px; width:26px; height:26px; border:1px solid var(--line);
    background: var(--panel-2); color: var(--ink-dim); border-radius:5px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; font-size:13px;
  }

  /* ---------------- bottom bar: big palette, always 2 rows ---------------- */
  .bottombar{
    flex-shrink:0;
    background: var(--panel); border-top: 1px solid var(--line);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    position:relative; z-index: 25;
  }
  .paletterow{
    display:grid; grid-template-rows: repeat(2, 1fr); grid-auto-flow: column;
    grid-auto-columns: minmax(0, 1fr); gap: 6px;
    height: 88px;
  }
  .brush{ width:100%; height:100%; border: 2px solid var(--line); cursor:pointer; border-radius:5px; }
  .brush.selected{ border-color: var(--accent-2); box-shadow: 0 0 0 2px rgba(247,167,8,0.35); }
  .brush.eraser{
    display:flex; align-items:center; justify-content:center; background: var(--panel-2);
    color: var(--ink-dim); font-size: 18px;
  }
  .brush.eraser.selected{ color: var(--accent-2); }
  .bottombar.empty .paletterow{ opacity:0.25; pointer-events:none; }
  .bottombar-msg{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; color: var(--ink-dim); pointer-events:none;
  }

  input[type=file]{ display:none; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="grp">
      <button id="undoBtn" class="ibtn" title="戻す" disabled>←</button>
      <button id="redoBtn" class="ibtn" title="進む" disabled>→</button>
    </div>
    <div class="grp">
      <button id="gearBtn" class="ibtn" title="画像・抽出・サイズ">⚙</button>
      <button id="savePaletteBtn" class="ibtn accent" title="パレットを保存">💾</button>
      <button id="loadPaletteBtn" class="ibtn accent" title="パレットを読み込み">📂</button>
      <button id="downloadBtn" class="ibtn accent" title="PNGをダウンロード" disabled>⬇</button>
    </div>
  </div>

  <div class="canvasarea" id="editViewport">
    <div id="outTransformWrap">
      <canvas id="cvOut" class="pixellayer"></canvas>
      <canvas id="cvRef" class="reflayer"></canvas>
      <canvas id="cvOutGrid" class="overlay"></canvas>
    </div>

    <div class="drop" id="drop">
      <div class="dropframe">
        <div class="big">📁</div>
        <p>クリックまたはドラッグ&ドロップで画像を読み込み<br>→ 自動で15色抽出してドット絵に変換します</p>
      </div>
    </div>

    <div class="backdrop" id="backdrop" hidden></div>

    <div class="sheet" id="gearSheet" hidden>
      <div class="close-sheet" id="closeGearSheet">×</div>
      <h3>画像・抽出・サイズ</h3>
      <div class="sheet-row">
        <button id="pickImageBtn" class="gsbtn">🖼 画像を開く</button>
        <span class="filename" id="filename">未選択</span>
      </div>
      <div class="sheet-row">
        <button id="extractBtn" class="gsbtn" disabled>🎨 抽出しなおす</button>
        <span class="lbl">サイズ</span>
        <select id="sizeSelect" disabled>
          <option value="8x8">8×8</option>
          <option value="16x16">16×16</option>
          <option value="32x32" selected>32×32</option>
          <option value="64x64">64×64</option>
          <option value="16x32">16×32(縦長)</option>
        </select>
      </div>
      <div class="sheet-row">
        <button id="refToggleBtn" class="gsbtn" disabled>🖼 参考画像を表示</button>
      </div>
      <div class="candidate-grid" id="candidateGrid"></div>
      <div class="hint-line">1本指=塗る/2本指=ズーム・移動/3本指=絵全体を移動。候補色をタップでパレットに追加・削除できます(緑チェック=使用中)。</div>
      <div class="status-line" id="statusLine">画像未読み込み</div>
    </div>

    <div class="sheet" id="fallbackSheet" hidden>
      <div class="close-sheet" id="closeFallbackSheet">×</div>
      <h3>ダウンロード</h3>
      <p class="hint-line" style="margin-bottom:0;">自動ダウンロードが反応しない場合は、下の画像を<strong>長押し</strong>して「画像を保存」を選んでください。</p>
      <img id="downloadPreviewImg" alt="ダウンロード用プレビュー">
    </div>
  </div>

  <div class="bottombar" id="bottombar">
    <div class="paletterow" id="brushRow"></div>
    <div class="bottombar-msg" id="bottombarMsg">画像を読み込むとここに色が並びます</div>
  </div>

  <input type="file" id="fileInput" accept="image/*">
  <input type="file" id="paletteFileInput" accept=".txt,text/plain">

<script>
(function(){
  let loadedImage = null;
  let currentW = 32, currentH = 32; // grid can be non-square now (e.g. 16x32)
  let currentZoom = 12;   // native draw resolution factor (fixed per size; NOT the pinch scale)
  let editImageData = null;   // the currently VISIBLE / exported currentW x currentH window
  let bufferImageData = null; // larger backing canvas ((w|h)*BUFFER_MULT) that keeps
                               // pixels safe when the artwork is shifted out of view
  let bufferW = 0, bufferH = 0;
  let viewOffsetX = 0, viewOffsetY = 0; // top-left of the visible window within the buffer
  const BUFFER_MULT = 3; // buffer is 3x the visible size -> 1x margin on every side
  let candidateColors = []; // [{r,g,b,pct}]
  let palette = [];         // hex strings currently "added"

  // ---- reference image overlay (semi-transparent guide on top of the pixel art) ----
  // Sampled directly from loadedImage at full resolution each redraw -- see
  // updateReferenceLayer() -- so no separate low-res buffer is kept for it.
  let showReference = false;
  const REFERENCE_OPACITY = 0.4;
  let brushColor = null;
  let eraserActive = false;
  let isPainting = false;
  let undoStack = []; // {buffer, offsetX, offsetY} snapshots (state before a stroke/shift)
  let redoStack = [];

  // pinch/pan (pure CSS transform layer, independent of currentZoom)
  let pinchScale = 1;
  let panX = 0, panY = 0;
  let pinchGesture = null;
  let shiftGesture = null;
  let activeTouchMode = null; // null | 'paint' | 'pinch' | 'shift'
  const MIN_SCALE = 0.5, MAX_SCALE = 8;

  // 1本指で描画を始めた直後に2本目/3本目の指が触れた場合、それが誤って打った
  // 1点だけを自動的になかったことにしてズーム/移動へ切り替えるための状態。
  // (「まだ動かしていない」かつ「触れてから短時間」の場合のみキャンセルする)
  let paintStartTime = 0;
  let paintMoved = false;
  let pendingCancelSnapshot = null;
  const MULTI_TOUCH_GRACE_MS = 150;

  const outCanvas = document.getElementById('cvOut');
  const outGridCanvas = document.getElementById('cvOutGrid');
  const refCanvas = document.getElementById('cvRef');
  const editViewport = document.getElementById('editViewport');
  const outTransformWrap = document.getElementById('outTransformWrap');
  const dropZone = document.getElementById('drop');
  const fileInput = document.getElementById('fileInput');
  const filenameEl = document.getElementById('filename');
  const extractBtn = document.getElementById('extractBtn');
  const pickImageBtn = document.getElementById('pickImageBtn');
  const savePaletteBtn = document.getElementById('savePaletteBtn');
  const loadPaletteBtn = document.getElementById('loadPaletteBtn');
  const paletteFileInput = document.getElementById('paletteFileInput');
  const candidateGrid = document.getElementById('candidateGrid');
  const sizeSelect = document.getElementById('sizeSelect');
  const refToggleBtn = document.getElementById('refToggleBtn');
  const brushRowEl = document.getElementById('brushRow');
  const bottombarEl = document.getElementById('bottombar');
  const bottombarMsg = document.getElementById('bottombarMsg');
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const downloadPreviewImg = document.getElementById('downloadPreviewImg');
  const statusLine = document.getElementById('statusLine');
  const gearBtn = document.getElementById('gearBtn');
  const gearSheet = document.getElementById('gearSheet');
  const fallbackSheet = document.getElementById('fallbackSheet');
  const backdrop = document.getElementById('backdrop');
  const closeGearSheet = document.getElementById('closeGearSheet');
  const closeFallbackSheet = document.getElementById('closeFallbackSheet');

  function hexToRgb(hex){
    hex = hex.replace('#','').trim();
    if(hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
    const n = parseInt(hex,16);
    return [(n>>16)&255, (n>>8)&255, n&255];
  }
  function rgbToHex(r,g,b){
    return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  }
  function normHex(h){ return h.toLowerCase(); }

  // ---------------- sheet open/close (only one visible at a time) ----------------
  function openSheet(sheetEl){
    gearSheet.hidden = sheetEl !== gearSheet;
    fallbackSheet.hidden = sheetEl !== fallbackSheet;
    backdrop.hidden = false;
    gearBtn.classList.toggle('on', sheetEl === gearSheet);
  }
  function closeSheets(){
    gearSheet.hidden = true;
    fallbackSheet.hidden = true;
    backdrop.hidden = true;
    gearBtn.classList.remove('on');
  }
  gearBtn.addEventListener('click', ()=>{
    if(!gearSheet.hidden){ closeSheets(); } else { openSheet(gearSheet); }
  });
  closeGearSheet.addEventListener('click', closeSheets);
  closeFallbackSheet.addEventListener('click', closeSheets);
  backdrop.addEventListener('click', closeSheets);

  // Image canvas + grid canvas are always drawn at the SAME native resolution
  // (size * currentZoom) with no independent CSS scaling on either -- this is
  // what keeps the grid lines and the pixel cells from ever drifting apart.
  // All zooming/panning for viewing is layered on top via a single CSS
  // transform on their shared parent (#outTransformWrap).
  function drawScaledImage(canvas, imageData, zoom){
    const w = imageData.width, h = imageData.height;
    canvas.width = w * zoom;
    canvas.height = h * zoom;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const tmp = document.createElement('canvas');
    tmp.width = w; tmp.height = h;
    tmp.getContext('2d').putImageData(imageData, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(tmp, 0, 0, w, h, 0, 0, w*zoom, h*zoom);
  }

  function drawGrid(canvas, w, h, zoom){
    canvas.width = w * zoom;
    canvas.height = h * zoom;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(zoom < 4) return;

    // thin line every cell (skip the ones that fall on an 8-cell boundary --
    // those are drawn thicker below)
    ctx.strokeStyle = 'rgba(140,130,180,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let x=0; x<=w; x++){
      if(x % 8 === 0) continue;
      ctx.moveTo(x*zoom + 0.5, 0);
      ctx.lineTo(x*zoom + 0.5, h*zoom);
    }
    for(let y=0; y<=h; y++){
      if(y % 8 === 0) continue;
      ctx.moveTo(0, y*zoom + 0.5);
      ctx.lineTo(w*zoom, y*zoom + 0.5);
    }
    ctx.stroke();

    // thicker line every 8 cells
    ctx.strokeStyle = 'rgba(205,196,232,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let x=0; x<=w; x+=8){
      ctx.moveTo(x*zoom, 0);
      ctx.lineTo(x*zoom, h*zoom);
    }
    for(let y=0; y<=h; y+=8){
      ctx.moveTo(0, y*zoom);
      ctx.lineTo(w*zoom, y*zoom);
    }
    ctx.stroke();
  }

  function cloneImageData(imgData){
    return new ImageData(new Uint8ClampedArray(imgData.data), imgData.width, imgData.height);
  }

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function copyIntoBuffer(buffer, src, offsetX, offsetY){
    const bw = buffer.width;
    const bd = buffer.data;
    const sw = src.width, sh = src.height;
    const sd = src.data;
    for(let y=0; y<sh; y++){
      const dstStart = ((offsetY+y)*bw + offsetX) * 4;
      const srcStart = (y*sw) * 4;
      bd.set(sd.subarray(srcStart, srcStart + sw*4), dstStart);
    }
  }

  function extractWindow(buffer, offsetX, offsetY, w, h){
    const out = new Uint8ClampedArray(w*h*4);
    const bw = buffer.width;
    const bd = buffer.data;
    for(let y=0; y<h; y++){
      const srcStart = ((offsetY+y)*bw + offsetX) * 4;
      const dstStart = (y*w) * 4;
      out.set(bd.subarray(srcStart, srcStart + w*4), dstStart);
    }
    return new ImageData(out, w, h);
  }

  function takeSnapshot(){
    return { buffer: cloneImageData(bufferImageData), offsetX: viewOffsetX, offsetY: viewOffsetY };
  }
  function restoreSnapshot(snap){
    bufferImageData = snap.buffer;
    viewOffsetX = snap.offsetX;
    viewOffsetY = snap.offsetY;
    editImageData = extractWindow(bufferImageData, viewOffsetX, viewOffsetY, currentW, currentH);
    drawScaledImage(outCanvas, editImageData, currentZoom);
    updateReferenceLayer();
  }

  // Redraws the reference (background guide) layer, windowed to the same
  // viewOffsetX/Y as the pixel data -- this is what keeps it in sync through
  // zoom, pan, and the 3-finger "shift" gesture.
  //
  // Samples directly from the ORIGINAL loaded image every time, rather than
  // from a copy pre-shrunk to the grid's own w x h -- a copy that small would
  // just be a blurred version of the same crushed detail the grid already
  // has, defeating the point of a reference. The buffer places the (stretched)
  // source image at [currentW, 2*currentW) x [currentH, 2*currentH) in
  // buffer-cell coordinates; that's a simple linear map back to the source
  // image's own pixel coordinates, so we can always pull full-resolution
  // pixels for whatever window is currently visible.
  function updateReferenceLayer(){
    const ctx = refCanvas.getContext('2d');
    refCanvas.width = currentW * currentZoom;
    refCanvas.height = currentH * currentZoom;
    ctx.clearRect(0, 0, refCanvas.width, refCanvas.height);
    if(!showReference || !loadedImage) return;

    const contentX0 = currentW, contentY0 = currentH; // where the real content starts in buffer-space
    const scaleX = loadedImage.width / currentW;
    const scaleY = loadedImage.height / currentH;

    // visible window (buffer-cell space) vs. the region that actually has source pixels
    const winX0 = viewOffsetX, winY0 = viewOffsetY;
    const winX1 = viewOffsetX + currentW, winY1 = viewOffsetY + currentH;
    const ovX0 = Math.max(winX0, contentX0), ovY0 = Math.max(winY0, contentY0);
    const ovX1 = Math.min(winX1, contentX0 + currentW), ovY1 = Math.min(winY1, contentY0 + currentH);
    if(ovX1 <= ovX0 || ovY1 <= ovY0) return; // shifted entirely outside the original content

    const sx = (ovX0 - contentX0) * scaleX, sy = (ovY0 - contentY0) * scaleY;
    const sw = (ovX1 - ovX0) * scaleX, sh = (ovY1 - ovY0) * scaleY;
    const dx = (ovX0 - winX0) * currentZoom, dy = (ovY0 - winY0) * currentZoom;
    const dw = (ovX1 - ovX0) * currentZoom, dh = (ovY1 - ovY0) * currentZoom;

    ctx.imageSmoothingEnabled = true; // the reference is a guide, not pixel art -- keep it smooth
    ctx.globalAlpha = REFERENCE_OPACITY;
    ctx.drawImage(loadedImage, sx, sy, sw, sh, dx, dy, dw, dh);
    ctx.globalAlpha = 1;
  }

  // ---------------- pinch / pan (2-finger) ----------------
  function applyTransform(){
    outTransformWrap.style.transform = `translate(${panX}px, ${panY}px) scale(${pinchScale})`;
  }

  function centerContent(){
    const vpRect = editViewport.getBoundingClientRect();
    const contentW = currentW * currentZoom;
    const contentH = currentH * currentZoom;
    outTransformWrap.style.width = contentW + 'px';
    outTransformWrap.style.height = contentH + 'px';
    pinchScale = 1;
    panX = (vpRect.width - contentW) / 2;
    panY = (vpRect.height - contentH) / 2;
    applyTransform();
  }

  function touchDistance(t1, t2){
    const dx = t1.clientX - t2.clientX, dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }
  function touchMidpoint(t1, t2){
    return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
  }

  function beginPinch(t0, t1){
    const rect = editViewport.getBoundingClientRect();
    const mid = touchMidpoint(t0, t1);
    pinchGesture = {
      startDist: touchDistance(t0, t1),
      startScale: pinchScale,
      originLeft: rect.left,
      originTop: rect.top,
      P0x: (mid.x - rect.left - panX) / pinchScale,
      P0y: (mid.y - rect.top - panY) / pinchScale,
    };
  }
  function updatePinch(t0, t1){
    if(!pinchGesture) return;
    const dist = touchDistance(t0, t1);
    let newScale = pinchGesture.startScale * (dist / pinchGesture.startDist);
    newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
    const mid = touchMidpoint(t0, t1);
    panX = (mid.x - pinchGesture.originLeft) - pinchGesture.P0x * newScale;
    panY = (mid.y - pinchGesture.originTop) - pinchGesture.P0y * newScale;
    pinchScale = newScale;
    applyTransform();
  }

  // ---------------- extraction ----------------
  // Some source PNGs use magenta as a transparency "matte": pixels along the
  // silhouette edge aren't cleanly alpha=0, they're a semi-transparent blend
  // tinted toward magenta. Treated naively, that tint gets counted as real
  // content and shows up as solid magenta speckles/edges in both the
  // extracted palette and the per-cell dominant-color conversion below.
  // isMagentaFringe() only ever flags non-fully-opaque pixels (a < 255), so a
  // deliberate, fully opaque magenta color elsewhere in an image (e.g. an
  // actual magenta background) is never mistaken for this artifact.
  const CONTENT_ALPHA_THRESHOLD = 128;
  function isMagentaFringe(r, g, b, a){
    if(a >= 255) return false;
    return g < r*0.6 && g < b*0.6 && Math.abs(r-b) < 40 && (r > 60 || b > 60);
  }
  function isRealContentPixel(r, g, b, a){
    return a >= CONTENT_ALPHA_THRESHOLD && !isMagentaFringe(r, g, b, a);
  }

  function extractDominantColors(imageData, maxColors){
    const freq = new Map();
    const d = imageData.data;
    for(let i=0;i<d.length;i+=4){
      const r=d[i], g=d[i+1], b=d[i+2], a=d[i+3];
      if(!isRealContentPixel(r,g,b,a)) continue;
      const key = r+','+g+','+b;
      freq.set(key, (freq.get(key)||0)+1);
    }
    const sorted = [...freq.entries()].map(([k,c])=>{
      const [r,g,b] = k.split(',').map(Number);
      return {r,g,b,count:c};
    }).sort((a,b)=>b.count-a.count);

    let minDist = 30;
    let picked = [];
    for(let attempt=0; attempt<6; attempt++){
      picked = [];
      for(const c of sorted){
        if(picked.length >= maxColors) break;
        let ok = true;
        for(const p of picked){
          const dr=c.r-p.r, dg=c.g-p.g, db=c.b-p.b;
          if(dr*dr+dg*dg+db*db < minDist*minDist){ ok=false; break; }
        }
        if(ok) picked.push(c);
      }
      if(picked.length >= Math.min(maxColors, sorted.length) || minDist<=4) break;
      minDist = Math.max(4, minDist-6);
    }
    const total = sorted.reduce((s,c)=>s+c.count,0) || 1;
    return picked.map(c=>({...c, pct: c.count/total*100}));
  }

  function runExtract(){
    if(!loadedImage) return;
    const tmp = document.createElement('canvas');
    tmp.width = loadedImage.width; tmp.height = loadedImage.height;
    const tctx = tmp.getContext('2d');
    tctx.imageSmoothingEnabled = false;
    tctx.drawImage(loadedImage, 0, 0);
    const raw = tctx.getImageData(0,0,tmp.width,tmp.height);

    candidateColors = extractDominantColors(raw, 15);
    palette = candidateColors.map(c => rgbToHex(c.r,c.g,c.b));
    renderCandidateGrid();
    renderBrushRow();
    updateSizeSelectEnabled();
    maybeReconvert();
  }
  extractBtn.addEventListener('click', runExtract);

  function applyLoadedPalette(text){
    const raw = text.split(/[\r\n,]+/).map(s=>s.trim()).filter(Boolean);
    const cleaned = raw.map(s => s.startsWith('#') ? s : '#'+s)
      .filter(s => /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(s));
    if(!cleaned.length) throw new Error('invalid palette data');
    palette = cleaned;
    renderCandidateGrid();
    renderBrushRow();
    updateSizeSelectEnabled();
    maybeReconvert();
    showStatus('パレットを読み込みました(' + palette.length + '色)', false);
  }

  function showStatus(text, isError){
    statusLine.textContent = text;
    statusLine.style.color = isError ? 'var(--danger)' : '';
  }

  savePaletteBtn.addEventListener('click', async ()=>{
    if(!palette.length){ showStatus('保存するパレットがありません。', true); openSheet(gearSheet); return; }
    const blob = new Blob([palette.join('\n')], {type:'text/plain'});
    try{
      await downloadBlob(blob, 'palette.txt');
    } catch(e){
      showStatus('保存に失敗しました。', true);
      openSheet(gearSheet);
    }
  });

  loadPaletteBtn.addEventListener('click', ()=>{
    paletteFileInput.click();
  });

  paletteFileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    paletteFileInput.value = '';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        applyLoadedPalette(ev.target.result);
      } catch(err){
        showStatus('読み込みに失敗しました。ファイルの中身を確認してください。', true);
        openSheet(gearSheet);
      }
    };
    reader.onerror = ()=>{ showStatus('ファイルの読み込みに失敗しました。', true); openSheet(gearSheet); };
    reader.readAsText(file);
  });

  function renderCandidateGrid(){
    candidateGrid.innerHTML = '';
    const paletteSet = new Set(palette.map(normHex));
    candidateColors.forEach(c=>{
      const hex = rgbToHex(c.r,c.g,c.b);
      const item = document.createElement('div');
      item.className = 'candidate' + (paletteSet.has(normHex(hex)) ? ' added' : '');
      item.title = hex;
      item.innerHTML = `<div class="cbox" style="background:${hex};"><div class="check">✓</div></div>`;
      item.addEventListener('click', ()=>{
        const idx = palette.findIndex(p => normHex(p) === normHex(hex));
        if(idx >= 0) palette.splice(idx,1);
        else palette.push(hex);
        renderCandidateGrid();
        renderBrushRow();
        updateSizeSelectEnabled();
        maybeReconvert();
      });
      candidateGrid.appendChild(item);
    });
  }

  function updateSizeSelectEnabled(){
    const ok = !!loadedImage && palette.length > 0;
    sizeSelect.disabled = !ok;
  }

  // Convert automatically whenever the image/palette state can support it --
  // removes the need for an explicit "convert" tap after extraction or after
  // toggling a candidate color.
  function maybeReconvert(){
    if(loadedImage && palette.length > 0){
      convert(currentW, currentH);
    }
  }

  // ---------------- file loading ----------------
  dropZone.addEventListener('click', ()=> fileInput.click());
  pickImageBtn.addEventListener('click', ()=> fileInput.click());
  dropZone.addEventListener('dragover', (e)=>{ e.preventDefault(); dropZone.classList.add('drag'); });
  dropZone.addEventListener('dragleave', ()=> dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', (e)=>{
    e.preventDefault();
    dropZone.classList.remove('drag');
    if(e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', (e)=>{
    if(e.target.files.length) loadFile(e.target.files[0]);
    fileInput.value = '';
  });

  function loadFile(file){
    filenameEl.textContent = file.name;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        loadedImage = img;

        outCanvas.getContext('2d').clearRect(0,0,outCanvas.width,outCanvas.height);
        outGridCanvas.getContext('2d').clearRect(0,0,outGridCanvas.width,outGridCanvas.height);
        refCanvas.getContext('2d').clearRect(0,0,refCanvas.width,refCanvas.height);
        editImageData = null;
        bufferImageData = null; bufferW = 0; bufferH = 0; viewOffsetX = 0; viewOffsetY = 0;
        undoStack = []; redoStack = [];
        undoBtn.disabled = true; redoBtn.disabled = true;
        downloadBtn.disabled = true;
        refToggleBtn.disabled = true;
        statusLine.textContent = '抽出中...';

        extractBtn.disabled = false;
        runExtract();
        statusLine.textContent = '色を抽出して変換しました';
        dropZone.style.display = 'none';
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ---------------- size -> convert ----------------
  // select values are "WxH" (e.g. "32x32", "16x32") so non-square grids work the same way
  sizeSelect.addEventListener('change', ()=>{
    const [w, h] = sizeSelect.value.split('x').map(n => parseInt(n, 10));
    currentW = w; currentH = h;
    convert(currentW, currentH);
  });

  refToggleBtn.addEventListener('click', ()=>{
    showReference = !showReference;
    refToggleBtn.classList.toggle('on', showReference);
    refToggleBtn.textContent = showReference ? '🖼 参考画像を隠す' : '🖼 参考画像を表示';
    updateReferenceLayer();
  });

  function zoomFor(w, h){
    // fit within the same on-screen budget regardless of orientation --
    // base the zoom on whichever dimension is larger
    return Math.max(4, Math.min(40, Math.round(384 / Math.max(w, h))));
  }

  // For each output cell, look at every source pixel that falls inside that
  // cell's region of the original image and use the most-frequent (mode)
  // opaque color as that cell's color -- rather than picking a single
  // (effectively random) sample point the way nearest-neighbor downscaling
  // does. This is one pass over the source image's pixels, partitioned by
  // cell, so it costs about the same as the initial color-extraction scan.
  // A cell that's mostly transparent stays transparent.
  // Cap how much source resolution we ever scan pixel-by-pixel. A photo can be
  // several thousand px on a side; the per-cell mode calculation gets plenty
  // of samples well below that, so this bounds worst-case time regardless of
  // how large the upload is, without changing the result in any visible way.
  const DOMINANT_SCAN_MAX_DIM = 1200;

  function computeCellDominantColors(img, w, h){
    let sw = img.width, sh = img.height;
    const longSide = Math.max(sw, sh);
    if(longSide > DOMINANT_SCAN_MAX_DIM){
      const s = DOMINANT_SCAN_MAX_DIM / longSide;
      sw = Math.max(1, Math.round(sw * s));
      sh = Math.max(1, Math.round(sh * s));
    }
    const srcCanvas = document.createElement('canvas');
    srcCanvas.width = sw; srcCanvas.height = sh;
    const sctx = srcCanvas.getContext('2d');
    sctx.imageSmoothingEnabled = true; // only matters if we downscaled above
    sctx.drawImage(img, 0, 0, sw, sh);
    const sd = sctx.getImageData(0, 0, sw, sh).data;

    const out = new ImageData(w, h);
    const od = out.data;
    const scaleX = sw / w, scaleY = sh / h;
    // Colors are grouped into coarse buckets before voting, so near-identical
    // anti-aliased shades (which rarely repeat exactly) still cluster into one
    // winning group instead of splitting the vote into noise. BUCKET_SHIFT=24
    // (matches the >>> below via division) groups each channel into ~11 steps.
    const BUCKET = 24;
    // key -> {count, sumR, sumG, sumB} -- reused across cells to avoid per-cell allocation
    const freq = new Map();

    for(let cy = 0; cy < h; cy++){
      const sy0 = Math.floor(cy * scaleY);
      const sy1 = Math.min(sh, Math.max(sy0 + 1, Math.floor((cy + 1) * scaleY)));
      for(let cx = 0; cx < w; cx++){
        const sx0 = Math.floor(cx * scaleX);
        const sx1 = Math.min(sw, Math.max(sx0 + 1, Math.floor((cx + 1) * scaleX)));

        freq.clear();
        let realCount = 0, totalCount = 0;
        for(let sy = sy0; sy < sy1; sy++){
          let idx = (sy * sw + sx0) * 4;
          for(let sx = sx0; sx < sx1; sx++, idx += 4){
            totalCount++;
            const r = sd[idx], g = sd[idx+1], b = sd[idx+2], a = sd[idx+3];
            if(!isRealContentPixel(r, g, b, a)) continue;
            realCount++;
            const key = ((r / BUCKET | 0) << 8) | ((g / BUCKET | 0) << 4) | (b / BUCKET | 0);
            let bucket = freq.get(key);
            if(bucket){ bucket.count++; bucket.sumR += r; bucket.sumG += g; bucket.sumB += b; }
            else freq.set(key, { count: 1, sumR: r, sumG: g, sumB: b });
          }
        }

        const outIdx = (cy * w + cx) * 4;
        // A cell that's mostly translucent/edge-halo rather than real content
        // (fewer than half its source pixels count as "real") is left
        // transparent, rather than forcing a color out of a minority sliver.
        if(realCount === 0 || realCount < totalCount / 2){
          od[outIdx+3] = 0;
        } else {
          let bestCount = -1, bestBucket = null;
          for(const bucket of freq.values()){
            if(bucket.count > bestCount){ bestCount = bucket.count; bestBucket = bucket; }
          }
          // Output the actual average color of the winning bucket, not the
          // bucket's quantized corner -- keeps the result true to the source.
          od[outIdx]   = Math.round(bestBucket.sumR / bestBucket.count);
          od[outIdx+1] = Math.round(bestBucket.sumG / bestBucket.count);
          od[outIdx+2] = Math.round(bestBucket.sumB / bestBucket.count);
          od[outIdx+3] = 255;
        }
      }
    }
    return out;
  }

  function convert(w, h){
    if(!loadedImage || !palette.length) return;
    const raw = computeCellDominantColors(loadedImage, w, h);

    const paletteRgb = palette.map(hexToRgb);
    const d = raw.data;
    for(let i=0; i<d.length; i+=4){
      if(d[i+3] === 0) continue;
      const r = d[i], g = d[i+1], b = d[i+2];
      let best = 0, bestDist = Infinity;
      for(let p=0; p<paletteRgb.length; p++){
        const [pr,pg,pb] = paletteRgb[p];
        const dr=r-pr, dg=g-pg, db=b-pb;
        const dist = dr*dr+dg*dg+db*db;
        if(dist < bestDist){ bestDist = dist; best = p; }
      }
      const [nr,ng,nb] = paletteRgb[best];
      d[i]=nr; d[i+1]=ng; d[i+2]=nb; d[i+3]=255;
    }

    bufferW = w * BUFFER_MULT;
    bufferH = h * BUFFER_MULT;
    bufferImageData = new ImageData(bufferW, bufferH); // fully transparent
    viewOffsetX = w; viewOffsetY = h; // center window = margin of w/h on each side
    copyIntoBuffer(bufferImageData, raw, viewOffsetX, viewOffsetY);

    editImageData = raw;
    currentW = w; currentH = h;
    currentZoom = zoomFor(w, h);
    drawScaledImage(outCanvas, editImageData, currentZoom);
    drawGrid(outGridCanvas, w, h, currentZoom);
    updateReferenceLayer();
    dropZone.style.display = 'none';
    centerContent();

    undoStack = []; redoStack = [];
    undoBtn.disabled = true; redoBtn.disabled = true;
    downloadBtn.disabled = false;
    refToggleBtn.disabled = false;
    if(!brushColor && palette.length) brushColor = palette[0];
    renderBrushRow();
    statusLine.textContent = w + '×' + h + ' に変換しました(' + palette.length + '色)';
  }

  // ---------------- brush row ----------------
  function renderBrushRow(){
    brushRowEl.innerHTML = '';
    palette.forEach(hex=>{
      const b = document.createElement('div');
      b.className = 'brush' + (!eraserActive && brushColor && normHex(brushColor)===normHex(hex) ? ' selected' : '');
      b.style.background = hex;
      b.title = hex;
      b.addEventListener('click', ()=>{
        brushColor = hex;
        eraserActive = false;
        renderBrushRow();
      });
      brushRowEl.appendChild(b);
    });
    const eraserEl = document.createElement('div');
    eraserEl.className = 'brush eraser' + (eraserActive ? ' selected' : '');
    eraserEl.textContent = '⌫';
    eraserEl.title = '消しゴム(透明化)';
    eraserEl.addEventListener('click', ()=>{
      eraserActive = true;
      renderBrushRow();
    });
    brushRowEl.appendChild(eraserEl);
    bottombarEl.classList.toggle('empty', palette.length === 0);
    bottombarMsg.style.display = palette.length === 0 ? 'flex' : 'none';
  }

  // ---------------- painting (shared by mouse + 1-finger touch) ----------------
  function canvasToPixel(e, canvas, zoom){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = (e.touches ? e.touches[0].clientX : e.clientX);
    const clientY = (e.touches ? e.touches[0].clientY : e.clientY);
    const x = (clientX - rect.left) * scaleX;
    const y = (clientY - rect.top) * scaleY;
    return { px: Math.floor(x / zoom), py: Math.floor(y / zoom) };
  }

  function paintAt(e){
    if(!editImageData) return;
    const { px, py } = canvasToPixel(e, outCanvas, currentZoom);
    if(px<0 || py<0 || px>=editImageData.width || py>=editImageData.height) return;
    const idx = (py*editImageData.width + px) * 4;
    const d = editImageData.data;
    let nr, ng, nb, na;
    if(eraserActive){
      if(d[idx+3] === 0) return;
      nr=d[idx]; ng=d[idx+1]; nb=d[idx+2]; na=0;
    } else if(brushColor){
      const [r,g,b] = hexToRgb(brushColor);
      if(d[idx]===r && d[idx+1]===g && d[idx+2]===b && d[idx+3]===255) return;
      nr=r; ng=g; nb=b; na=255;
    } else {
      return;
    }
    d[idx]=nr; d[idx+1]=ng; d[idx+2]=nb; d[idx+3]=na;

    if(bufferImageData){
      const bw = bufferImageData.width;
      const bIdx = ((viewOffsetY+py)*bw + (viewOffsetX+px)) * 4;
      const bd = bufferImageData.data;
      bd[bIdx]=nr; bd[bIdx+1]=ng; bd[bIdx+2]=nb; bd[bIdx+3]=na;
    }

    const ctx = outCanvas.getContext('2d');
    if(na === 0){
      ctx.clearRect(px*currentZoom, py*currentZoom, currentZoom, currentZoom);
    } else {
      ctx.fillStyle = brushColor;
      ctx.fillRect(px*currentZoom, py*currentZoom, currentZoom, currentZoom);
    }
  }

  function beginStroke(e){
    if(!editImageData || !bufferImageData) return;
    const snap = takeSnapshot();
    undoStack.push(snap);
    if(undoStack.length > 50) undoStack.shift();
    redoStack = [];
    undoBtn.disabled = false;
    redoBtn.disabled = true;
    isPainting = true;
    // remember this snapshot so a same-instant 2nd/3rd finger touch can
    // silently undo this stroke before it ever shows up in undo history
    paintStartTime = performance.now();
    paintMoved = false;
    pendingCancelSnapshot = snap;
    paintAt(e);
  }

  // If the finger currently painting hasn't moved yet and started less than
  // MULTI_TOUCH_GRACE_MS ago, treat whatever it just painted as accidental
  // (caused by a 2nd/3rd finger landing a beat later for zoom/move) and
  // silently revert it -- it never shows up in the undo stack.
  function cancelAccidentalPaint(){
    if(activeTouchMode === 'paint' && pendingCancelSnapshot && !paintMoved &&
       (performance.now() - paintStartTime) < MULTI_TOUCH_GRACE_MS){
      if(undoStack[undoStack.length - 1] === pendingCancelSnapshot) undoStack.pop();
      restoreSnapshot(pendingCancelSnapshot);
      undoBtn.disabled = undoStack.length === 0;
      redoBtn.disabled = true;
    }
    pendingCancelSnapshot = null;
    isPainting = false;
  }

  // mouse (desktop) -- unaffected by pinch/pan, no gesture ambiguity
  outCanvas.addEventListener('mousedown', (e)=>{ beginStroke(e); });
  outCanvas.addEventListener('mousemove', (e)=>{ if(isPainting) paintAt(e); });
  window.addEventListener('mouseup', ()=>{ isPainting = false; });

  // touch: 1 finger = paint, 2 fingers = pinch-zoom + pan, 3 fingers = move the artwork itself
  editViewport.addEventListener('touchstart', (e)=>{
    if(!gearSheet.hidden || !fallbackSheet.hidden) return; // ignore canvas gestures while a sheet is open
    if(e.touches.length >= 3){
      e.preventDefault();
      cancelAccidentalPaint();
      activeTouchMode = 'shift';
      beginShiftGesture(e.touches);
    } else if(e.touches.length === 2 && activeTouchMode !== 'shift'){
      e.preventDefault();
      cancelAccidentalPaint();
      activeTouchMode = 'pinch';
      beginPinch(e.touches[0], e.touches[1]);
    } else if(e.touches.length === 1 && activeTouchMode !== 'pinch' && activeTouchMode !== 'shift'){
      if(!editImageData) return;
      e.preventDefault();
      activeTouchMode = 'paint';
      beginStroke(e);
    }
  }, {passive:false});

  editViewport.addEventListener('touchmove', (e)=>{
    if(activeTouchMode === 'shift' && e.touches.length >= 3){
      e.preventDefault();
      updateShiftGesture(e.touches);
    } else if(activeTouchMode === 'pinch' && e.touches.length >= 2){
      e.preventDefault();
      updatePinch(e.touches[0], e.touches[1]);
    } else if(activeTouchMode === 'paint' && isPainting && e.touches.length === 1){
      e.preventDefault();
      paintMoved = true;
      paintAt(e);
    }
  }, {passive:false});

  function endAllTouch(e){
    if(!e.touches || e.touches.length === 0){
      activeTouchMode = null;
      isPainting = false;
      pinchGesture = null;
      shiftGesture = null;
      pendingCancelSnapshot = null;
    }
  }
  window.addEventListener('touchend', endAllTouch);
  window.addEventListener('touchcancel', endAllTouch);

  function touchCentroid(touches){
    let sx = 0, sy = 0;
    for(let i=0; i<touches.length; i++){ sx += touches[i].clientX; sy += touches[i].clientY; }
    return { x: sx/touches.length, y: sy/touches.length };
  }

  function beginShiftGesture(touches){
    if(!editImageData || !bufferImageData){ shiftGesture = null; return; }
    undoStack.push(takeSnapshot());
    if(undoStack.length > 50) undoStack.shift();
    redoStack = [];
    undoBtn.disabled = false;
    redoBtn.disabled = true;
    const c = touchCentroid(touches);
    shiftGesture = {
      startX: c.x, startY: c.y,
      baseOffsetX: viewOffsetX, baseOffsetY: viewOffsetY,
      appliedDX: 0, appliedDY: 0
    };
  }

  function updateShiftGesture(touches){
    if(!shiftGesture) return;
    const c = touchCentroid(touches);
    const screenDX = c.x - shiftGesture.startX;
    const screenDY = c.y - shiftGesture.startY;
    const scalePxPerNative = currentZoom * pinchScale;
    const dx = Math.round(screenDX / scalePxPerNative);
    const dy = Math.round(screenDY / scalePxPerNative);
    if(dx !== shiftGesture.appliedDX || dy !== shiftGesture.appliedDY){
      const maxOffsetX = bufferW - currentW;
      const maxOffsetY = bufferH - currentH;
      viewOffsetX = clamp(shiftGesture.baseOffsetX - dx, 0, maxOffsetX);
      viewOffsetY = clamp(shiftGesture.baseOffsetY - dy, 0, maxOffsetY);
      editImageData = extractWindow(bufferImageData, viewOffsetX, viewOffsetY, currentW, currentH);
      drawScaledImage(outCanvas, editImageData, currentZoom);
      updateReferenceLayer();
      shiftGesture.appliedDX = dx; shiftGesture.appliedDY = dy;
    }
  }

  undoBtn.addEventListener('click', ()=>{
    if(!undoStack.length || !bufferImageData) return;
    redoStack.push(takeSnapshot());
    const prev = undoStack.pop();
    restoreSnapshot(prev);
    undoBtn.disabled = undoStack.length === 0;
    redoBtn.disabled = false;
  });
  redoBtn.addEventListener('click', ()=>{
    if(!redoStack.length || !bufferImageData) return;
    undoStack.push(takeSnapshot());
    const next = redoStack.pop();
    restoreSnapshot(next);
    redoBtn.disabled = redoStack.length === 0;
    undoBtn.disabled = false;
  });

  /* ホーム画面に追加して開いた「スタンドアロン表示」かどうかを判定。
     この状態のiOS Safariでは通常の<a download>クリックでは保存できない
     (何も起きない)ことがあるため、その場合だけ扱いを変える。 */
  function isStandaloneMode(){
    return (window.navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }

  async function downloadBlob(blob, filename){
    if(isStandaloneMode()){
      try{
        const file = new File([blob], filename, {type: blob.type || 'image/png'});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({files:[file]});
          showStatus('共有シートを開きました', false);
          return true;
        }
      } catch(err){
        if(err && err.name === 'AbortError'){ return true; }
      }
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(()=> URL.revokeObjectURL(url), 60000);
      showStatus(`「${filename}」を新しいタブで開きました。保存できない場合は画面を長押しして保存してください`, false);
      return true;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 500);
    return false;
  }

  downloadBtn.addEventListener('click', async ()=>{
    if(!editImageData) return;
    const tmp = document.createElement('canvas');
    tmp.width = editImageData.width; tmp.height = editImageData.height;
    tmp.getContext('2d').putImageData(editImageData, 0, 0);
    const filename = `dotart_${currentW}x${currentH}.png`;
    const dataUrl = tmp.toDataURL('image/png');

    let messageShown = false;
    try{
      const blob = await new Promise(resolve => tmp.toBlob(resolve, 'image/png'));
      if(blob){
        messageShown = await downloadBlob(blob, filename);
      }
    } catch(e){ /* ignore -- the long-press fallback below still works */ }

    downloadPreviewImg.src = dataUrl;
    openSheet(fallbackSheet);
    if(!messageShown){
      showStatus('自動ダウンロードが効かない場合は、下の画像を長押しして保存してください', false);
    }
  });

  window.addEventListener('resize', ()=>{
    if(editImageData) centerContent();
  });

  renderBrushRow();
})();
</script>
